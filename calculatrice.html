<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculatrice</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="top"><a href="index.html">← Accueil</a></div>
  <h1>Calculatrice</h1>
  <div class="calc">
    <div class="scr"><small id="ex"></small><output id="v">0</output></div>
    <div class="keys" id="k"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(async()=>{
if(!await Auth.guard())return;
const L=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];
const K=document.getElementById('k');
K.innerHTML=L.map(x=>`<button data-k="${x}" class="${'÷×−+'.includes(x)?'o':x==='='?'eq':''}">${x==='.'?',':x}</button>`).join('');
let cur='0',acc=null,op=null,fresh=true,expr='';
const fmt=n=>String(+n.toPrecision(12));
const calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b===0?NaN:a/b):b;
const show=()=>{document.getElementById('v').textContent=cur==='NaN'?'Impossible':cur.replace('.',',');document.getElementById('ex').textContent=expr};
function press(k){
  if(cur==='NaN'&&k!=='C')k='C';
  if(/\d|\./.test(k)){
    if(fresh){cur=k==='.'?'0.':k;fresh=false}
    else{if(k==='.'&&cur.includes('.'))return;cur=cur==='0'&&k!=='.'?k:cur+k}
  }else if('÷×−+'.includes(k)){
    if(op&&!fresh){acc=calc(acc,+cur,op);cur=isNaN(acc)?'NaN':fmt(acc)}else acc=+cur;
    if(cur!=='NaN'){op=k;expr=fmt(acc)+' '+k}else{op=null;expr=''}
    fresh=true;
  }else if(k==='='){
    if(op){const r=calc(acc,+cur,op);expr=fmt(acc)+' '+op+' '+cur+' =';cur=isNaN(r)?'NaN':fmt(r);op=null;acc=null;fresh=true}
  }else if(k==='C'){cur='0';acc=null;op=null;fresh=true;expr=''}
  else if(k==='⌫'){cur=(fresh||cur.length<=1||(cur.length===2&&cur[0]==='-'))?'0':cur.slice(0,-1)}
  else if(k==='±'){if(cur!=='0')cur=cur[0]==='-'?cur.slice(1):'-'+cur}
  else if(k==='%'){cur=fmt(+cur/100);fresh=true}
  show();
}
K.addEventListener('click',e=>{const b=e.target.closest('button');if(b)press(b.dataset.k)});
const M={'*':'×','/':'÷','-':'−',Enter:'=','=':'=',Backspace:'⌫',Escape:'C',',':'.'};
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=M[e.key]||e.key;
  if(/^[0-9.+=]$/.test(k)||'÷×−C⌫'.includes(k)&&k.length===1){e.preventDefault();press(k)}
});
})();
</script>
</body>
</html>
