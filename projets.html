<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi des projets</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
<style>
.fl{display:flex;gap:10px;margin:14px 0 0}.fl>*{flex:1}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.bd{display:inline-block;align-self:flex-start;border-radius:99px;padding:3px 11px;color:#fff;font:.78rem 'Instrument Sans',sans-serif;white-space:nowrap}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.br{display:grid;grid-template-columns:8rem 1fr auto;gap:10px;align-items:center;font:.85rem 'Instrument Sans',sans-serif;margin:7px 0}
.br span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br i{display:block;height:10px;border-radius:10px;background:var(--c,var(--acc))}
.pipe{display:flex;gap:4px;margin:18px 0 6px;height:58px}
.pp{flex:1 1 0;min-width:44px;border:0;border-bottom:4px solid var(--c);border-radius:10px;background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--ink);cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;font:.7rem 'Instrument Sans',sans-serif;transition:transform .15s,background .2s}
.pp:hover{transform:translateY(-2px)}.pp b{font:700 1.2rem 'Fraunces',serif}.pp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pp[aria-pressed=true]{background:var(--c);color:#fff}
.gh{display:flex;align-items:baseline;gap:10px;margin:28px 0 10px;font:700 1.3rem 'Fraunces',serif}.gh small{color:var(--mute);font:.85rem 'Instrument Sans',sans-serif}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--bc);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;transition:transform .2s,box-shadow .2s}
.pc:hover{transform:translateY(-4px);box-shadow:0 14px 24px -16px rgba(60,40,140,.55)}
.pc h3{margin:6px 0 0;font:700 1.35rem 'Fraunces',serif}.pc p{margin:0;font:.88rem 'Instrument Sans',sans-serif}.pc .m{color:var(--mute)}
.ft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font:.85rem 'Instrument Sans',sans-serif;color:var(--mute)}
.ch{display:inline-block;background:color-mix(in srgb,var(--acc) 12%,var(--card));border-radius:99px;padding:3px 10px;font:.82rem 'Instrument Sans',sans-serif;color:var(--ink)}.ch.soon{background:#d98a1c;color:#fff}.ch.late{background:#b3261e;color:#fff}
.an .pc{animation:up .45s cubic-bezier(.2,.7,.2,1) var(--d,0ms) backwards}
.ttl{font:700 2.1rem/1.15 'Fraunces',serif;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:4px 0;margin-top:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding-bottom:18px}
details label{display:block;font:600 .85rem 'Instrument Sans',sans-serif;color:var(--mute);margin:0 0 4px}
.er{display:grid;grid-template-columns:24px 150px 1fr auto;gap:8px;margin-bottom:8px;align-items:center}.er input[type=checkbox]{width:18px;height:18px}
details>.btn{margin-bottom:18px}
</style>
</head>
<body>
<main>
  <div class="top"><a href="index.html">← Accueil</a><button class="lnk" id="out">Se déconnecter</button></div>
  <h1>Suivi des projets</h1>
  <p class="sub" id="st">Chargement…</p>
  <div id="v"></div>
</main>
<div id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(async()=>{
const u=await Auth.guard();if(!u)return;
const sb=Auth.sb,UID=u.id,$=s=>document.querySelector(s);
const STAT=['Brouillon','En préparation','Déposé','Accepté','Refusé','Liste complémentaire','Annulé'];
const COL={Brouillon:'#8a84a3','En préparation':'#d98a1c','Déposé':'#3b7fd4','Accepté':'#1fa37a','Refusé':'#c0392b','Liste complémentaire':'#8e5bd1','Annulé':'#6d6d6d'};
const SOUMIS=['Déposé','Accepté','Refusé','Liste complémentaire'],DECIDES=['Accepté','Refusé','Liste complémentaire'];
const DEF={prog:['Horizon Europe','ANR','Interreg','Erasmus+','Autre'],disp:['ERC','MSCA','Cluster 1','Cluster 2','Cluster 3','Cluster 4','Cluster 5','Cluster 6','EIC','Widening'],role:['Coordinateur','Partenaire','Tiers lié']};
const F=[['acr','Acronyme','text'],['annee','Année de dépôt','number'],['prog','Programme','text','prog'],['disp','Dispositif','text','disp'],['call','Call (appel à projets)','text'],['role','Rôle de l’établissement','text','role'],['labo','Laboratoire','text','labo'],['porteur','Porteur interne','text','por'],['contact','Contact du porteur','text'],['statut','Statut','select'],['budget','Budget (€)','number'],['debut','Date de début','date'],['fin','Date de fin','date'],['mois','Nombre de mois','number']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const dfr=d=>d?new Date(d+'T00:00').toLocaleDateString('fr-FR'):'';
const today=new Date().toISOString().slice(0,10);
let P=[],tab='list',flt={q:'',s:''},V={s:'home'},G='annee',ANIM=true,OPEN={i:1,q:1,b:1,e:1},pend=0,chain=Promise.resolve();
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)};
const setSt=(m,bad)=>{$('#st').textContent=m;$('#st').style.color=bad?'#b3261e':''};
const run=fn=>{pend++;chain=chain.then(fn).then(r=>{if(r&&r.error)throw r.error;if(!--pend)setSt('Enregistré sur ton compte')}).catch(e=>{pend=Math.max(0,pend-1);setSt('⚠ Non enregistré : '+(e.message||e)+'. Réessaie ou exporte en CSV.',true)})};
const saveP=id=>run(()=>{const p=P.find(x=>x.id===id);if(!p)return;const{id:_,...data}=p;return sb.from('projets').upsert({id,user_id:UID,data},{onConflict:'user_id,id'})});
const delP=id=>run(()=>sb.from('projets').delete().eq('id',id));
window.addEventListener('beforeunload',e=>{if(pend){e.preventDefault();e.returnValue=''}});

const FM=Object.fromEntries(F.map(f=>[f[0],f]));
const cur=()=>P.find(x=>x.id===V.id);
const nextEch=p=>['Refusé','Annulé'].includes(p.statut)?null:(p.ech||[]).filter(e=>e.date&&!e.done).sort((a,b)=>a.date.localeCompare(b.date))[0];
const days=d=>Math.round((new Date(d)-new Date(today))/864e5);
const filtered=()=>P.filter(p=>(!flt.s||p.statut===flt.s)&&(!flt.q||[p.acr,p.prog,p.disp,p.call,p.labo,p.porteur,p.contact,p.statut,p.annee,p.notes].join(' ').toLowerCase().includes(flt.q.toLowerCase())))
  .sort((a,b)=>(b.annee||0)-(a.annee||0)||(a.acr||'').localeCompare(b.acr||''));
const tabsHtml=()=>`<div class="seg">${[['list','Projets'],['stats','Statistiques']].map(([k,l])=>`<button data-t="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div>`;
const chip=p=>{const e=nextEch(p);if(!e)return '';const d=days(e.date);return `<span class="ch${d<0?' late':d<=14?' soon':''}">${d<0?'En retard · ':''}${dfr(e.date)} · ${esc(e.label)}</span>`};
const card=(p,i)=>`<button class="pc" data-id="${esc(p.id)}" style="--bc:${COL[p.statut]};--d:${Math.min(i,14)*40}ms"><span class="bd" style="background:${COL[p.statut]}">${esc(p.statut)}</span><h3>${esc(p.acr||'Sans titre')}</h3><p>${esc([p.prog,p.disp].filter(Boolean).join(' · '))}</p><p class="m">${esc([p.labo,p.porteur].filter(Boolean).join(' — '))}</p><div class="ft"><span>${p.budget?eur(p.budget):''}</span>${chip(p)}</div></button>`;
function cards(){
  const L=filtered(),m=new Map();
  L.forEach(p=>{const g=G==='statut'?p.statut:String(p[G]||'Non renseigné');if(!m.has(g))m.set(g,[]);m.get(g).push(p)});
  const ks=[...m.keys()].sort(G==='annee'?(a,b)=>b.localeCompare(a,'fr',{numeric:true}):G==='statut'?(a,b)=>STAT.indexOf(a)-STAT.indexOf(b):(a,b)=>a.localeCompare(b));let i=0;
  $('#cards').innerHTML=ks.length?ks.map(g=>`<div class="gh">${esc(g)}<small>${m.get(g).length} projet${m.get(g).length>1?'s':''}</small></div><div class="pcs">${m.get(g).map(p=>card(p,i++)).join('')}</div>`).join(''):`<p class="sub">${P.length?'Aucun projet ne correspond.':'Aucun projet pour l’instant : clique sur « Nouveau projet ».'}</p>`;
}
function home(){
  const A=P.filter(p=>p.statut==='Accepté'),D=P.filter(p=>DECIDES.includes(p.statut)),S=P.filter(p=>SOUMIS.includes(p.statut));
  const k=(v,l)=>`<div class="stat"><span class="v">${v}</span><small>${l}</small></div>`;
  const pipe=STAT.map(s=>{const n=P.filter(p=>p.statut===s).length;return n?`<button class="pp" data-s="${s}" aria-pressed="${flt.s===s}" style="flex:${n};--c:${COL[s]}" title="${s}"><b>${n}</b><span>${s}</span></button>`:''}).join('');
  const up=P.map(p=>({p,e:nextEch(p)})).filter(x=>x.e).sort((a,b)=>a.e.date.localeCompare(b.e.date)).slice(0,4);
  $('#v').innerHTML=`${tabsHtml()}<div class="stats">${k(S.length,'projets déposés')}${k(A.length,'acceptés')}${k(D.length?Math.round(A.length/D.length*100)+' %':'–','taux de succès')}${k(eur(A.reduce((t,p)=>t+(+p.budget||0),0)),'budget accepté')}</div>
  ${up.length?`<p class="hint" style="margin:14px 0 6px">Prochaines échéances</p><div class="facts">${up.map(({p,e})=>`<button class="lnk" data-id="${esc(p.id)}" style="text-decoration:none"><span class="ch${days(e.date)<0?' late':days(e.date)<=14?' soon':''}"><b>${esc(p.acr)}</b> · ${dfr(e.date)} · ${esc(e.label)}</span></button>`).join('')}</div>`:''}
  <div class="pipe">${pipe}</div><p class="hint">${flt.s?`Filtre : ${esc(flt.s)} · <button class="lnk" data-s="">tout afficher</button>`:'Clique sur un statut pour filtrer.'}</p>
  <div class="bar"><div class="seg">${[['annee','Année'],['statut','Statut'],['prog','Programme'],['labo','Laboratoire']].map(([k,l])=>`<button data-g="${k}" aria-pressed="${G===k}">${l}</button>`).join('')}</div><div><button class="btn" data-a="csv">Exporter CSV</button> <button class="btn p" data-a="add">Nouveau projet</button></div></div>
  <div class="fl"><input id="q" type="search" placeholder="Rechercher un projet, un labo, un porteur…" value="${esc(flt.q)}"></div><div id="cards"></div>`;
  cards();$('#q').oninput=e=>{flt.q=e.target.value;cards()};
}
function page(){
  const p=cur();if(!p){V={s:'home'};return home()}
  document.documentElement.style.setProperty('--bc',COL[p.statut]);
  const dl=(n,k)=>`<datalist id="dl-${n}">${[...new Set([...(DEF[n]||[]),...P.map(x=>x[k]).filter(Boolean)])].map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
  const fld=k=>{const[,l,t,d]=FM[k];return `<div><label>${l}</label><input data-k="${k}" type="${t}"${d?` list="dl-${d}"`:''} value="${esc(p[k])}"${t==='number'?' min="0" step="any"':''}${k==='mois'?' placeholder="auto"':''}></div>`};
  const sec=(id,t,ks)=>`<details data-d="${id}"${OPEN[id]?' open':''}><summary>${t}</summary><div class="g">${ks.map(fld).join('')}</div></details>`;
  const ech=p.ech||[];
  $('#v').innerHTML=`<div class="top"><button class="lnk" data-a="back">← Tous les projets</button></div>
  <input class="ttl" data-k="acr" placeholder="Acronyme du projet" value="${esc(p.acr)}">
  <p class="sub">${esc([p.prog,p.disp,p.call].filter(Boolean).join(' · '))||'Complète les informations ci-dessous'}</p>
  <div class="mood">${STAT.map(s=>`<button data-st="${s}" aria-pressed="${p.statut===s}">${s}</button>`).join('')}</div>
  ${sec('i','Identité du projet',['annee','prog','disp','call','role'])}${sec('q','Équipe interne',['labo','porteur','contact'])}${sec('b','Budget et calendrier',['budget','debut','fin','mois'])}
  <details data-d="e"${OPEN.e?' open':''}><summary>Échéances${ech.length?` (${ech.length})`:''}</summary>${ech.map((e,i)=>`<div class="er"><input type="checkbox" data-ei="${i}" data-ef="done" title="Fait"${e.done?' checked':''}><input type="date" data-ei="${i}" data-ef="date" value="${esc(e.date)}"><input type="text" data-ei="${i}" data-ef="label" placeholder="Intitulé" value="${esc(e.label)}"><button type="button" class="lnk" data-x="${i}">Retirer</button></div>`).join('')}<button class="btn" data-a="ae">+ Ajouter une échéance</button></details>
  <details data-d="n"${OPEN.n?' open':''}><summary>Notes</summary><textarea data-n="1" rows="5">${esc(p.notes)}</textarea></details>
  ${dl('prog','prog')+dl('disp','disp')+dl('role','role')+dl('labo','labo')+dl('por','porteur')}
  <div class="nav"><button class="btn" data-a="back">← Retour</button><button class="btn" data-a="del">Supprimer ce projet</button></div>`;
}
function render(){
  document.documentElement.style.setProperty('--bc','#5b3fd1');
  document.querySelector('h1').hidden=V.s==='proj';
  const an=ANIM;ANIM=false;
  if(V.s==='proj')page();else if(tab==='stats')stats();else home();
  $('#v').classList.toggle('an',an);
}
let tT=0,tId='';
const touch=p=>{delete p._new;tId=p.id;clearTimeout(tT);setSt('Modification en cours…');tT=setTimeout(()=>{tT=0;saveP(p.id)},600)};
const flush=()=>{if(tT){clearTimeout(tT);tT=0;saveP(tId)}};
const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
const go=v=>{flush();V=v;ANIM=true;render();scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
window.addEventListener('beforeunload',e=>{if(tT){e.preventDefault();e.returnValue=''}});
$('#v').addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.d)OPEN[e.target.dataset.d]=e.target.open},true);
$('#v').addEventListener('input',e=>{
  const t=e.target,p=V.s==='proj'&&cur();if(!p)return;
  if(t.dataset.k){const k=t.dataset.k;p[k]=['annee','budget','mois'].includes(k)&&t.value!==''?+t.value:t.value;
    if(k==='mois')p.moisAuto=false;
    if((k==='debut'||k==='fin')&&p.debut&&p.fin&&(p.mois===''||p.mois==null||p.moisAuto)){p.mois=Math.max(0,Math.round((new Date(p.fin)-new Date(p.debut))/2629800000));p.moisAuto=true;$('[data-k=mois]').value=p.mois}
    touch(p)}
  else if(t.dataset.ei!==undefined){const x=p.ech[t.dataset.ei];if(t.type==='checkbox')x.done=t.checked;else x[t.dataset.ef]=t.value;touch(p)}
  else if(t.dataset.n){p.notes=t.value;touch(p)}
});
$('#v').addEventListener('click',e=>{
  const b=e.target.closest('[data-a],[data-t],[data-g],[data-s],[data-id],[data-st],[data-x]');if(!b)return;const d=b.dataset;
  if(d.t){tab=d.t;ANIM=true;render()}
  else if(d.g){G=d.g;render()}
  else if(d.s!==undefined){flt.s=flt.s===d.s?'':d.s;render()}
  else if(d.id)go({s:'proj',id:d.id});
  else if(d.st){const p=cur();p.statut=d.st;touch(p);keep()}
  else if(d.x!==undefined){const p=cur();p.ech.splice(+d.x,1);touch(p);keep()}
  else if(d.a==='ae'){const p=cur();(p.ech=p.ech||[]).push({date:'',label:''});OPEN.e=1;touch(p);keep()}
  else if(d.a==='back'){const p=cur();if(p&&p._new)P=P.filter(x=>x!==p);go({s:'home'})}
  else if(d.a==='add'){const p={id:'p-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),statut:'Brouillon',annee:new Date().getFullYear(),ech:[],_new:true};P.push(p);go({s:'proj',id:p.id})}
  else if(d.a==='del'){const p=cur();if(confirm('Supprimer « '+(p.acr||'ce projet')+' » ? Une copie reste dans l’historique de la base.')){clearTimeout(tT);tT=0;P=P.filter(x=>x!==p);if(!p._new)delP(p.id);go({s:'home'})}}
  else if(d.a==='csv')csv();
});
$('#out').onclick=()=>Auth.out();
const grp=(L,k)=>{const m={};L.forEach(p=>{const n=String(p[k]||'Non renseigné');const o=m[n]||(m[n]={n:0,a:0});o.n++;if(p.statut==='Accepté')o.a++});return Object.entries(m)};
const byN=r=>r.sort((x,y)=>y[1].n-x[1].n||x[0].localeCompare(y[0]));
const panel=(t,rows,c)=>{const mx=Math.max(1,...rows.map(r=>r[1].n));return `<div class="stat"><h3>${t}</h3>${rows.length?rows.map(([k,o])=>`<div class="br"><span title="${esc(k)}">${esc(k)}</span><i style="width:${o.n/mx*100}%;--c:${c||'var(--acc)'}"></i><span>${o.n}${o.a?` · ${o.a} ✓`:''}</span></div>`).join(''):'<p class="hint">Pas encore de données.</p>'}</div>`};
function stats(){
  const S=P.filter(p=>SOUMIS.includes(p.statut)),A=P.filter(p=>p.statut==='Accepté'),D=P.filter(p=>DECIDES.includes(p.statut));
  const sum=L=>L.reduce((t,p)=>t+(+p.budget||0),0),taux=D.length?Math.round(A.length/D.length*100)+' %':'–';
  const k=(v,l)=>`<div class="stat"><span class="v">${v}</span><small>${l}</small></div>`;
  const ech=P.filter(p=>!['Refusé','Annulé'].includes(p.statut)).flatMap(p=>(p.ech||[]).filter(e=>e.date>=today&&!e.done).map(e=>({...e,acr:p.acr}))).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);
  $('#v').innerHTML=tabsHtml()+`<div class="stats">${k(P.length,'projets suivis')}${k(S.length,'déposés')}${k(A.length,'acceptés')}${k(taux,'taux de succès*')}${k(eur(sum(S)),'budget déposé')}${k(eur(sum(A)),'budget accepté')}${k(P.filter(p=>['Brouillon','En préparation'].includes(p.statut)).length,'en préparation')}</div>
  <div class="pn">${panel('Déposés par année',grp(S,'annee').sort((a,b)=>a[0].localeCompare(b[0])))}
  ${panel('Par statut',STAT.map(s=>[s,{n:P.filter(p=>p.statut===s).length,a:0}]).filter(r=>r[1].n),'#8e5bd1')}
  ${panel('Laboratoires qui déposent le plus',byN(grp(S,'labo')).slice(0,10),'#3b7fd4')}
  ${panel('Programmes',byN(grp(S,'prog')),'#1fa37a')}${panel('Dispositifs',byN(grp(S,'disp')),'#d98a1c')}
  ${panel('Rôle de l’établissement',byN(grp(S,'role')),'#c0392b')}${panel('Porteurs internes',byN(grp(S,'porteur')).slice(0,8),'#5b3fd1')}
  <div class="stat"><h3>Échéances à venir</h3>${ech.length?ech.map(e=>`<div class="br" style="grid-template-columns:5.5rem 1fr"><span>${dfr(e.date)}</span><span><b>${esc(e.acr)}</b> · ${esc(e.label)}</span></div>`).join(''):'<p class="hint">Aucune échéance à venir.</p>'}</div></div>
  <p class="hint" style="margin-top:14px">Déposé = statuts Déposé, Accepté, Refusé ou Liste complémentaire. ✓ = acceptés. *Taux de succès = acceptés ÷ projets ayant reçu une décision (acceptés, refusés, liste complémentaire).</p>`;
}
const csv=()=>{const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"',H=F.map(f=>f[1]).concat(['Échéances','Notes']);
  const t=[H.map(c).join(';')].concat(filtered().map(p=>F.map(f=>c(p[f[0]])).concat([c((p.ech||[]).map(e=>e.date+' '+e.label).join(' | ')),c(p.notes)]).join(';'))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='projets.csv';a.click()};

const{data,error}=await sb.from('projets').select('id,data').order('id');
if(error){setSt(/relation|does not exist|schema cache/i.test(error.message)?'⚠ La table « projets » n’existe pas encore : lance supabase_projets.sql dans Supabase (voir la marche à suivre).':'⚠ Chargement impossible : '+error.message,true);return}
P=data.map(r=>({...r.data,id:r.id}));setSt(P.length+' projet'+(P.length>1?'s':'')+' · enregistré sur ton compte');render();
})();
</script>
</body>
</html>
